name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elytra-swing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
          build-root-directory: elytra-swing
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: elytra-swing
          path: elytra-swing/build/libs/*.jar
